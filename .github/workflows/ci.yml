name: CI Pipeline

on:
  push:
    branches:
      - main
      - gowtham
      - balasujith
      - balaganesh
      - bharathraj
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dogfood_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dogfood_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dogfood_test?schema=public"
      JWT_SECRET: "test-jwt-secret-key-at-least-32-chars-long-dogfood"
      AUTH_DISABLED: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Schema to Test Database
        run: npx prisma db push --skip-generate

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Test Suite
        run: npm test

      - name: Build Next.js Application
        run: npm run build
